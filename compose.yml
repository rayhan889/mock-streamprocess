services:
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic tweets.raw --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic tweets.sentiment --partitions 3 --replication-factor 1;
        do echo "waiting for kafka to be ready..."; sleep 2; done

  extractor-service:
    build:
      context: .
      dockerfile: extractor-service/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}

  sink-service:
    build:
      context: .
      dockerfile: sink-service/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      MONGO_URI: ${MONGO_URI}

  spark-master:
    build:
      context: ./spark-sentiment-service
      dockerfile: Dockerfile
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker-1:
    build:
      context: ./spark-sentiment-service
      dockerfile: Dockerfile
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master

  spark-worker-2:
    build:
      context: ./spark-sentiment-service
      dockerfile: Dockerfile
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master

  spark-sentiment-service:
    build:
      context: ./spark-sentiment-service
      dockerfile: Dockerfile
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.driver.host=spark-sentiment-service
      - --conf
      - spark.driver.port=7078
      - --conf
      - spark.driver.blockManager.port=7079
      - --conf
      - spark.sql.adaptive.enabled=false
      - --py-files
      - cleaning.py,schema.py,sentiment.py
      - job.py
    user: "0:0"
    ports:
      - "4040:4040"
      - "7078:7078"
      - "7079:7079"
    volumes:
      - spark-checkpoints:/checkpoints
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      SPARK_MASTER_URL: spark://spark-master:7077
      TRIGGER_INTERVAL: ${TRIGGER_INTERVAL}
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER}
      CHECKPOINT_DIR: ${CHECKPOINT_DIR}
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started

volumes:
  spark-checkpoints: